id: selectivity-crossover
title: Find the seq-scan crossover point
layer: 2
difficulty: 3

prompt: |
  `idx_events_score (score)` already exists. The query below sums a column that
  is **not** in that index, so every matching row means a visit to the heap.

  At `score < 100000` (1% of the table) the planner chooses a sequential scan.
  At some smaller threshold it switches to the index. That switch is the
  **crossover point**, and it is the single most important intuition in query
  performance: an index is not "faster", it is faster *below a certain
  selectivity*.

  **Your job:** find a threshold where the index still wins, and get total
  blocks touched under 150,000.

  Then read the notes — the second half of this exercise is about
  `random_page_cost`, and the answer there is not what you would expect.

starting_query: |
  -- 1% of the table. The planner picks a seq scan here. Sweep the threshold
  -- down (30000, 20000, 10000 ...) and watch the plan flip.
  SELECT sum(pincode) FROM events WHERE score < 100000;

hints:
  - "score is uniform over 0..1,000,000, so `score < N` selects roughly N/10,000 percent of the table. Work out what fraction you are asking for."
  - "Watch the node type change as you lower the threshold: Seq Scan -> Bitmap Heap Scan. Note the blocks touched at each step, not the milliseconds."
  - "The flip happens between 0.2% and 1%. Try score < 20000."

assertions:
  - type: no_node
    node_type: Seq Scan
    relation: events
    because: "Below the crossover the planner should be reaching for the index."
  - type: max_total_blocks
    value: 150000
    because: "The seq scan touches ~194,000 blocks. A bitmap scan at 0.2% touches ~125,000. Above 150,000 you are still on the wrong side of the crossover."
